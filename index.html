<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Ore di lavoro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ore">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#EEF1F4;--surface:#fff;--ink:#16202B;--mute:#6A7886;--line:#DCE2E8;--acc:#0F6B6F;--acc-ink:#fff;--over:#B4600B;--wk:#E6EAEE;--hero:#16202B;--hero-ink:#F2F5F7;--bar:#2E7F83}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1419;--surface:#17202A;--ink:#E8EDF1;--mute:#8C9AA8;--line:#26323E;--acc:#3FB0B5;--acc-ink:#0E1419;--over:#E39A4B;--wk:#121A22;--hero:#1D2935;--hero-ink:#F2F5F7;--bar:#3FB0B5}}
:root[data-theme="dark"]{--bg:#0E1419;--surface:#17202A;--ink:#E8EDF1;--mute:#8C9AA8;--line:#26323E;--acc:#3FB0B5;--acc-ink:#0E1419;--over:#E39A4B;--wk:#121A22;--hero:#1D2935;--hero-ink:#F2F5F7;--bar:#3FB0B5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;font-variant-numeric:tabular-nums;max-width:560px;margin:0 auto;padding-bottom:40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hero{background:radial-gradient(120% 90% at 100% 0,rgba(63,176,181,.25),transparent 60%),var(--hero);color:var(--hero-ink);padding:16px 18px 20px;border-radius:0 0 28px 28px;overflow:hidden}
.nav{display:flex;align-items:center;justify-content:space-between}
.nav h1{font-size:17px;font-weight:600;margin:0;text-transform:capitalize}
.ib{background:rgba(255,255,255,.1);border:0;color:inherit;width:40px;height:40px;border-radius:12px;font-size:20px;line-height:1}
.total{margin:18px 0 0;font-size:clamp(44px,15vw,60px);font-weight:700;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.unit{font-size:14px;opacity:.75;margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 4px}
.tools button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px;font-weight:500;font-size:14px}
.tools .pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.tools .full{flex:1 1 100%}
.tools .dg{color:#C0392B}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.ai{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.ai div{flex:1;min-width:0}
.ai b{display:block}
.ai small{color:var(--mute);font-size:13px}
.ai button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px;font-size:13px}
.ai .del{color:#C0392B}
textarea{resize:none;display:block;padding-right:54px}
.nw{position:relative}
.mic{position:absolute;right:6px;top:6px;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);color:var(--acc);display:flex;align-items:center;justify-content:center}
.mic.on{background:#C0392B;color:#fff;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.th{position:relative;width:68px;height:68px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:12px;background:var(--bg);display:block}
.th .rm{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#C0392B;color:#fff;font-size:15px;line-height:1;padding:0}
.addph{width:68px;height:68px;border:1px dashed var(--mute);background:transparent;border-radius:12px;font-size:12.5px;color:var(--mute)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.pbs{display:flex;gap:8px;margin-top:10px}
.pbtn{position:relative;flex:1;border:1px dashed var(--mute);border-radius:12px;padding:12px 8px;text-align:center;font-size:14px;font-weight:500;overflow:hidden}
.pbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.list{padding:8px 16px}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.row.we{background:transparent;border-style:dashed}
.row.today{border-color:var(--acc)}
.d{width:48px;height:52px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.d b{font-size:20px;font-weight:600}
.d span{font-size:11.5px;color:var(--mute);text-transform:capitalize}
.row.today .d{background:var(--acc);color:var(--acc-ink)}
.row.today .d span{color:inherit;opacity:.85}
.mid{min-width:0}
.mid b{font-size:18px;font-weight:600}
.mid small{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .none{color:var(--mute);font-weight:400;font-size:15px}
.mb{height:5px;background:var(--line);border-radius:5px;margin-top:6px;overflow:hidden}
.mb i{display:block;height:100%;background:var(--acc);border-radius:5px}
.row.over .mb i{background:var(--over)}
.row.over .mid b{color:var(--over)}
.cum{text-align:right;font-size:11.5px;color:var(--mute);line-height:1.2}
.cum b{display:block;font-size:15px;color:var(--ink);background:var(--bg);padding:3px 8px;border-radius:8px;margin-bottom:2px;font-weight:600}
.g>div{min-width:0}
.g input{min-width:0;min-height:46px;padding:10px 8px;font-size:16px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,20,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h2{margin:0 0 2px;font-size:19px;text-transform:capitalize}
.sheet .calc{color:var(--mute);font-size:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px;font-weight:500}
.g label{margin-top:0}
input,textarea{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.acts{display:flex;gap:10px;margin-top:18px}
.acts button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:500}
.acts .save{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600;flex:2}
.acts .del{color:#C0392B}
.set{display:flex;align-items:center;gap:10px}
.set input{width:90px}
.note{padding:6px 20px;color:var(--mute);font-size:12.5px}
</style>
</head>
<body>
<header class="hero">
  <div class="nav">
    <button class="ib" id="prev" aria-label="Mese precedente">‹</button>
    <h1 id="mname"></h1>
    <button class="ib" id="next" aria-label="Mese successivo">›</button>
  </div>
  <div class="total" id="tot">0:00</div>
  <div class="unit" id="sub"></div>
</header>
<div class="tools">
  <button class="pri full" id="today">Segna oggi</button>
  <button id="m-save">Salva mese</button>
  <button class="dg" id="m-reset">Azzera mese</button>
  <button id="m-arch">Archivio</button>
</div>
<main class="list" id="list"></main>
<p class="note">I dati restano salvati su questo telefono, dentro l'app.</p>

<div class="sheet-bg" id="bg">
  <div class="sheet" role="dialog" aria-modal="true">
    <h2 id="sh-title"></h2>
    <div class="calc" id="sh-calc">Nessuna ora registrata</div>
    <div class="g">
      <div><label for="f-s">Inizio</label><input type="time" id="f-s"></div>
      <div><label for="f-e">Fine</label><input type="time" id="f-e"></div>
      <div><label for="f-p">Pausa (min)</label><input type="number" id="f-p" inputmode="numeric" min="0" step="5" placeholder="0"></div>
    </div>
    <label for="f-h">Oppure ore totali (es. 7,5 o 7:30)</label>
    <input type="text" id="f-h" inputmode="decimal" placeholder="Lascia vuoto per usare inizio e fine">
    <label for="f-n">Nota</label>
    <div class="nw">
      <textarea id="f-n" rows="3" placeholder="Cliente, attività… oppure detta con il microfono"></textarea>
      <button type="button" class="mic" id="mic" aria-label="Dettatura vocale"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
    <div class="ph" id="ph"></div>
    <div class="pbs">
      <label class="pbtn">Scatta foto<input type="file" id="f-cam" accept="image/*" capture="environment"></label>
      <label class="pbtn">Dalla galleria<input type="file" id="f-file" accept="image/*" multiple></label>
    </div>
    <div class="acts">
      <button class="del" id="b-del">Elimina</button>
      <button id="b-no">Annulla</button>
      <button class="save" id="b-ok">Salva</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="bg3">
  <div class="sheet" role="dialog" aria-modal="true">
    <h2>Mesi salvati</h2>
    <div id="arch"></div>
    <div class="acts"><button id="a-no">Chiudi</button></div>
  </div>
</div>

<div class="sheet-bg" id="bg2">
  <div class="sheet" role="dialog" aria-modal="true">
    <h2 id="c-title"></h2>
    <div class="calc" id="c-text"></div>
    <div class="acts">
      <button id="c-no">Annulla</button>
      <button class="save" id="c-ok">Conferma</button>
    </div>
  </div>
</div>
<div class="viewer" id="bg4"><img id="vimg" alt="Foto della nota"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var KEY="ore-lavoro-v1";
  var db={entries:{},target:8};
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.entries){db=p;if(!db.target)db.target=8;}}}catch(e){}
  /* giornate scritte come "7:30" con la versione precedente: ricalcola il totale giusto */
  for(var k0 in db.entries){var e0=db.entries[k0];if(e0&&e0.h&&/[:h]/i.test(String(e0.h))){var v0=hrs(e0.h);if(!isNaN(v0))e0.m=v0;}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true;}catch(e){toast("Memoria del telefono piena: modifica non salvata");return false;}}
  var pad=function(n){return n<10?"0"+n:""+n};
  var key=function(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d)};
  var fmt=function(m){m=Math.round(m);return Math.floor(m/60)+":"+pad(m%60)};
  var now=new Date(),vy=now.getFullYear(),vm=now.getMonth(),cur=null;
  var $=function(i){return document.getElementById(i)};
  var MES=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  var GIO=["dom","lun","mar","mer","gio","ven","sab"];

  function minutes(s,e,p,h){
    if(h!==""&&h!=null){var v=hrs(h);return isNaN(v)?0:v;}
    if(!s||!e)return 0;
    var a=s.split(":"),b=e.split(":");
    var d=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);
    if(d<0)d+=1440;
    return Math.max(0,d-(parseInt(p)||0));
  }
  /* ore totali: accetta 7 · 7,5 · 7.5 · 7:30 · 7h30 (restituisce minuti, NaN se non valido) */
  function hrs(h){
    var v=String(h).trim().toLowerCase().replace(/\s+/g,""),m=v.match(/^(\d{1,2})[:h](\d{0,2})$/),r;
    if(m){if(+m[2]>59)return NaN;r=+m[1]*60+(+m[2]||0);}
    else if(/^\d{1,2}([.,]\d+)?$/.test(v))r=Math.round(parseFloat(v.replace(",","."))*60);
    else return NaN;
    return r>1440?NaN:r;
  }
  function weekdays(y,m){var n=new Date(y,m+1,0).getDate(),c=0;for(var d=1;d<=n;d++){var w=new Date(y,m,d).getDay();if(w>0&&w<6)c++;}return c;}

  function render(){
    var n=new Date(vy,vm+1,0).getDate(),sum=0,days=0,html="";
    $("mname").textContent=MES[vm]+" "+vy;
    var t0=new Date(),tk=key(t0.getFullYear(),t0.getMonth(),t0.getDate());
    for(var d=1;d<=n;d++){
      var k=key(vy,vm,d),w=new Date(vy,vm,d).getDay(),en=db.entries[k],we=(w===0||w===6);
      var m=en?en.m:0;
      if(m>0){sum+=m;days++;}
      var cls="row"+(we?" we":"")+(k===tk?" today":"");
      var detail="";
      if(en){
        if(en.h!==""&&en.h!=null)detail="Ore inserite a mano";
        else if(en.s&&en.e)detail=en.s+" – "+en.e+((parseInt(en.p)||0)>0?" · pausa "+en.p+" min":"");
        if(en.ph&&en.ph.length)detail+=(detail?" · ":"")+en.ph.length+" foto";
        if(en.n)detail+=(detail?" · ":"")+en.n;
      }
      html+='<button class="'+cls+'" data-k="'+k+'" data-d="'+d+'">'+
        '<div class="d"><b>'+d+'</b><span>'+GIO[w]+'</span></div>'+
        '<div class="mid">'+(m>0?'<b>'+fmt(m)+'</b>':'<span class="none">'+(we?"Riposo":"Nessuna ora")+'</span>')+(detail?'<small>'+esc(detail)+'</small>':'')+'</div>'+
        '<div class="cum">'+(sum>0?'<b>'+fmt(sum)+'</b>progressivo':'')+'</div></button>';
    }
    $("list").innerHTML=html;
    $("tot").textContent=fmt(sum);
    $("sub").textContent="ore effettuate nel mese · "+(days===0?"nessun giorno lavorato":days+(days===1?" giorno lavorato":" giorni lavorati"));
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  function open(k){
    cur=k;var p=k.split("-"),dt=new Date(+p[0],+p[1]-1,+p[2]),en=db.entries[k]||{};
    $("sh-title").textContent=GIO[dt.getDay()]+" "+dt.getDate()+" "+MES[dt.getMonth()];
    $("f-s").value=en.s||"";$("f-e").value=en.e||"";$("f-p").value=en.p||"";
    $("f-h").value=en.h||"";$("f-n").value=en.n||"";curPh=(en.ph||[]).slice();drawThumbs();
    $("b-del").style.visibility=db.entries[k]?"visible":"hidden";
    calc();$("bg").classList.add("on");
  }
  function calc(){
    var hv=$("f-h").value.trim();
    if(hv&&isNaN(hrs(hv))){$("sh-calc").textContent="Ore non valide: scrivi ad esempio 7,5 oppure 7:30";return;}
    var m=minutes($("f-s").value,$("f-e").value,$("f-p").value,$("f-h").value);
    $("sh-calc").textContent=m>0?"Totale della giornata: "+fmt(m)+" ore":"Nessuna ora registrata";
  }
  ["f-s","f-e","f-p","f-h"].forEach(function(i){$(i).addEventListener("input",calc)});
  function close(){try{if(rec&&listening)rec.stop();}catch(e){}$("bg4").classList.remove("on");$("bg").classList.remove("on");$("bg2").classList.remove("on");$("bg3").classList.remove("on");}

  $("list").addEventListener("click",function(ev){var b=ev.target.closest(".row");if(b)open(b.dataset.k);});
  $("b-no").onclick=close;$("c-no").onclick=function(){$("bg2").classList.remove("on");};
  $("bg").addEventListener("click",function(e){if(e.target===$("bg"))close();});
  $("bg2").addEventListener("click",function(e){if(e.target===$("bg2"))$("bg2").classList.remove("on");});
  $("b-ok").onclick=function(){
    var s=$("f-s").value,e=$("f-e").value,p=$("f-p").value,h=$("f-h").value.trim(),n=$("f-n").value.trim();
    if(h&&isNaN(hrs(h))){toast("Ore non valide: scrivi ad esempio 7,5 oppure 7:30");$("f-h").focus();return;}
    var m=minutes(s,e,p,h);
    if(m===0&&!n&&!curPh.length){delete db.entries[cur];}
    else db.entries[cur]={s:s,e:e,p:p,h:h,n:n,m:m,ph:curPh.slice()};
    save();close();render();
  };
  $("b-del").onclick=function(){delete db.entries[cur];save();close();render();};
  $("prev").onclick=function(){vm--;if(vm<0){vm=11;vy--;}render();};
  $("next").onclick=function(){vm++;if(vm>11){vm=0;vy++;}render();};
  $("today").onclick=function(){now=new Date();vy=now.getFullYear();vm=now.getMonth();render();open(key(vy,vm,now.getDate()));};

  var ym=function(){return vy+"-"+pad(vm+1)};
  function monthEntries(p){var o={};for(var k in db.entries){if(k.indexOf(p+"-")===0)o[k]=db.entries[k];}return o;}
  function totalOf(o){var t=0,d=0;for(var k in o){if(o[k].m>0){t+=o[k].m;d++;}}return{t:t,d:d};}
  var cfn=null;
  function ask(title,text,label,fn){$("c-title").textContent=title;$("c-text").textContent=text;$("c-ok").textContent=label;cfn=fn;$("bg2").classList.add("on");}
  $("c-ok").onclick=function(){var f=cfn;close();if(f)f();};
  var tT=null;
  function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tT);tT=setTimeout(function(){e.classList.remove("on")},2200);}
  $("m-save").onclick=function(){
    var o=monthEntries(ym()),r=totalOf(o);
    if(!r.d){toast("Nessuna ora da salvare in questo mese");return;}
    db.archive=db.archive||{};var had=!!db.archive[ym()];
    db.archive[ym()]={total:r.t,days:r.d,entries:o};save();
    toast(had?"Mese aggiornato in archivio":"Mese salvato in archivio");
  };
  $("m-reset").onclick=function(){
    var o=monthEntries(ym());
    if(!Object.keys(o).length){toast("Il mese è già vuoto");return;}
    var a=db.archive&&db.archive[ym()];
    ask("Azzerare "+MES[vm]+"?","Verranno cancellate tutte le ore del mese. "+(a?"Una copia è nell'archivio e potrai ripristinarla.":"Il mese non è salvato in archivio: premi prima Salva mese per conservarlo."),"Azzera mese",function(){
      for(var k in o)delete db.entries[k];save();render();toast("Mese azzerato");
    });
  };
  function drawArch(){
    var ks=Object.keys(db.archive||{}).sort().reverse(),h="";
    if(!ks.length)h='<div class="calc">Nessun mese salvato. Usa Salva mese per archiviare il totale.</div>';
    ks.forEach(function(k){var a=db.archive[k],p=k.split("-");
      h+='<div class="ai"><div><b>'+MES[+p[1]-1]+' '+p[0]+'</b><small>'+fmt(a.total)+' ore · '+a.days+' giorni</small></div><button data-r="'+k+'">Ripristina</button><button class="del" data-x="'+k+'">Elimina</button></div>';});
    $("arch").innerHTML=h;
  }
  $("m-arch").onclick=function(){drawArch();$("bg3").classList.add("on");};
  $("a-no").onclick=close;
  $("bg3").addEventListener("click",function(e){if(e.target===$("bg3"))close();});
  $("arch").addEventListener("click",function(e){
    var r=e.target.dataset.r,x=e.target.dataset.x;
    if(r){
      var a=db.archive[r],p=r.split("-"),old=monthEntries(r);
      for(var k in old)delete db.entries[k];
      for(var k2 in a.entries)db.entries[k2]=a.entries[k2];
      save();vy=+p[0];vm=+p[1]-1;close();render();toast("Mese ripristinato");
    }else if(x){
      ask("Eliminare dall'archivio?","Il mese salvato verrà cancellato in modo definitivo.","Elimina",function(){delete db.archive[x];save();drawArch();$("bg3").classList.add("on");});
    }
  });

  var curPh=[],cache={},idb=null,rec=null,listening=false;
  function idbOpen(){try{var r=indexedDB.open("ore-foto",1);r.onupgradeneeded=function(){r.result.createObjectStore("p");};r.onsuccess=function(){idb=r.result;};}catch(e){}}
  function lsPut(id,d,cb){try{localStorage.setItem("foto-"+id,d);cb(true);}catch(e){cb(false);}}
  function putPhoto(id,d,cb){
    if(!idb){lsPut(id,d,cb);return;}
    try{var t=idb.transaction("p","readwrite");t.objectStore("p").put(d,id);t.oncomplete=function(){cb(true)};t.onerror=function(){lsPut(id,d,cb)};}catch(e){lsPut(id,d,cb);}
  }
  function getPhoto(id,cb){
    if(cache[id]){cb(cache[id]);return;}
    var ls=function(){var v=null;try{v=localStorage.getItem("foto-"+id);}catch(e){}if(v)cache[id]=v;cb(v);};
    if(!idb){ls();return;}
    try{var q=idb.transaction("p").objectStore("p").get(id);q.onsuccess=function(){if(q.result){cache[id]=q.result;cb(q.result);}else ls();};q.onerror=ls;}catch(e){ls();}
  }
  function drawThumbs(){
    var h="";
    curPh.forEach(function(id){h+='<div class="th"><img data-v="'+id+'" alt="Foto"><button type="button" class="rm" data-rm="'+id+'" aria-label="Rimuovi foto">×</button></div>';});
    $("ph").innerHTML=h;
    curPh.forEach(function(id){getPhoto(id,function(d){var im=$("ph").querySelector('img[data-v="'+id+'"]');if(im&&d)im.src=d;});});
  }
  $("ph").addEventListener("click",function(e){
    var t=e.target;
    if(t.dataset.rm){curPh=curPh.filter(function(x){return x!==t.dataset.rm});drawThumbs();}
    else if(t.dataset.v&&t.src){$("vimg").src=t.src;$("bg4").classList.add("on");}
  });
  $("bg4").onclick=function(){$("bg4").classList.remove("on");};
  function shrink(file,cb){
    var fr=new FileReader();
    fr.onload=function(){var im=new Image();
      im.onload=function(){var M=1280,r=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");
        c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        cb(c.toDataURL("image/jpeg",0.7));};
      im.onerror=function(){cb(null)};im.src=fr.result;};
    fr.onerror=function(){cb(null)};fr.readAsDataURL(file);
  }
  var onPick=function(){
    var files=Array.prototype.slice.call(this.files||[]);this.value="";
    files.forEach(function(file){shrink(file,function(d){
      if(!d){toast("Foto non leggibile");return;}
      var id="p"+Date.now()+Math.floor(Math.random()*1000);
      putPhoto(id,d,function(ok){
        if(!ok){toast("Impossibile salvare la foto");return;}
        cache[id]=d;curPh.push(id);drawThumbs();
      });
    });});
  };
  $("f-file").onchange=onPick;$("f-cam").onchange=onPick;
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  $("mic").onclick=function(){
    var tip=function(){toast("Per dettare usa il microfono della tastiera");$("f-n").focus();};
    if(!SR||window.navigator.standalone===true){tip();return;}
    if(listening){rec.stop();return;}
    var base=$("f-n").value.replace(/\s+$/,""),got=false,failed=false,timer=null;
    rec=new SR();rec.lang="it-IT";rec.interimResults=true;rec.continuous=false;
    rec.onresult=function(ev){got=true;var t="";for(var i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;$("f-n").value=(base?base+" ":"")+t;};
    rec.onend=function(){clearTimeout(timer);listening=false;$("mic").classList.remove("on");if(!got&&!failed)tip();};
    rec.onerror=function(ev){failed=true;if(ev.error==="no-speech")toast("Non ho sentito nulla");else tip();};
    try{rec.start();listening=true;$("mic").classList.add("on");timer=setTimeout(function(){if(listening&&!got){try{rec.stop();}catch(e){}}},6000);}catch(e){tip();}
  };
  idbOpen();
  render();
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&!$("bg").classList.contains("on"))render();});

  if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
</script>
</body>
</html>
